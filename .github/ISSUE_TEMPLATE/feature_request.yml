name: Feature request
description: Suggest an improvement or a new feature
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **Do not include confidential information** (passwords, server addresses, patient data).
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The task or problem, in your own words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How should it work?
  - type: textarea
    id: context
    attributes:
      label: Anything else
